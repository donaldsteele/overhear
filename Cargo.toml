[workspace]
resolver = "3"
members = ["crates/overhear-decode", "crates/overhear", "crates/overhear-testgen"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Don Steele"]

[workspace.dependencies]
overhear-decode = { path = "crates/overhear-decode" }
overhear = { path = "crates/overhear" }
overhear-testgen = { path = "crates/overhear-testgen" }
pcap = "2.5"
pcap-file = "2.0"
clap = { version = "4.6", features = ["derive"] }
ratatui = "0.29"
jiff = "1"
nix = { version = "0.32", features = ["user", "process", "signal"] }
caps = "0.5"
ctrlc = { version = "3.5", features = ["termination"] }
serde_json = "1"
