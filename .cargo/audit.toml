# cargo audit settings for scripts/check.sh.
#
# ratatui is pinned to 0.29 because 0.30 needs Rust 1.88, above the minimum
# supported Rust of 1.85. These advisories reach us only through ratatui 0.29's
# dependencies; drop them when ratatui can be upgraded.
[advisories]
ignore = [
    "RUSTSEC-2024-0436", # paste 1.0.15: unmaintained
    "RUSTSEC-2026-0002", # lru 0.12.5: IterMut violates Stacked Borrows (unsound)
    "RUSTSEC-2026-0253", # lru 0.12.5: LruCache::pop() not panic safe (unsound)
]
